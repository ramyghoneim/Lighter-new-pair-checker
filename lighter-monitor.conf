# Lighter Pair Monitor - Supervisor Configuration
# Install: sudo cp lighter-monitor.conf /etc/supervisor/conf.d/
# Then: sudo supervisorctl reread && sudo supervisorctl update

[program:lighter-monitor]
command=/home/lighter-monitor/Lighter-new-pair-checker/venv/bin/python3 /home/lighter-monitor/Lighter-new-pair-checker/scheduler.py
directory=/home/lighter-monitor/Lighter-new-pair-checker
user=lighter-monitor
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/lighter-monitor/monitor.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
environment=PATH="/home/lighter-monitor/Lighter-new-pair-checker/venv/bin",HOME="/home/lighter-monitor"

# Resource limits
startsecs=10
stopasgroup=true
killasgroup=true
